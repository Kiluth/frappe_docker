name: Kiluth / Build & push image

# Builds the Kiluth ERPNext image (Frappe + ERPNext + HRMS + kiluth_portal)
# and pushes to ghcr.io/Kiluth/erpnext. After the push succeeds, hits the
# Coolify deploy API so the running portal.kiluth.com containers pull the
# new :latest image — no manual click required.
#
# The image is built from frappe_docker's images/layered/Containerfile —
# upstream's standard "install N extra apps on top of frappe/build" recipe.
# We pass our apps.json (which lists ERPNext, HRMS, kiluth_portal) as a
# Docker BuildKit secret so it's not baked into image layers.
#
# Triggers:
#  - push to main when apps.json, the Containerfile, or this workflow change
#  - manual dispatch (re-build on demand without commits)
#
# Heads up: a kiluth_portal commit alone does NOT trigger this workflow,
# because frappe_docker doesn't watch that repo. To pick up a kiluth_portal
# change you need to either (a) workflow_dispatch from the Actions tab, or
# (b) bump something inside this repo so the path filter fires. With
# `branch: main` in apps.json, the build pulls kiluth_portal HEAD at run
# time, so the trigger source doesn't matter — only that something runs.
#
# Auto-deploy: the "Trigger Coolify redeploy" step at the end of this
# workflow POSTs to coolify.kiluth.com's deploy API for the
# portal.kiluth.com app. It needs repo secret `COOLIFY_TOKEN` (created
# in Coolify → Keys & Tokens → API tokens). If the secret is missing the
# step skips silently with a warning so first-time setup doesn't fail
# the build.
#
# Last triggered for kiluth_portal commit 93da433 (fix broken logo + font
# URLs in letter_head and web_page fixtures so they stop reverting on migrate).

on:
  push:
    branches: [main]
    paths:
      - "apps.json"
      - "images/**"
      - "compose.production.yaml"
      - "example.kiluth.env"
      - ".github/workflows/kiluth-build-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (default: ERPNEXT_VERSION from .env)"
        required: false
        type: string

# Default permissions are read-only; this job needs write to push to GHCR.
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Read pinned versions from .env (CUSTOM_TAG / ERPNEXT_VERSION).
      # Falls back to inputs.tag if a manual dispatch overrides.
      - name: Read pinned versions
        id: vars
        run: |
          set -euo pipefail
          erpnext_version=$(grep '^ERPNEXT_VERSION=' example.kiluth.env | cut -d= -f2)
          custom_tag=$(grep '^CUSTOM_TAG=' example.kiluth.env | cut -d= -f2)
          override="${{ inputs.tag }}"
          tag="${override:-$custom_tag}"
          echo "frappe_branch=$erpnext_version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Containerfile reads /opt/frappe/apps.json via a BuildKit secret
      # mount. secret-files= passes the raw file under the `apps_json` id.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          platforms: linux/amd64
          # Ghcr.io is case-insensitive on org names but the repo path is
          # normalised lowercase — keep tags lowercase to match.
          tags: |
            ghcr.io/kiluth/erpnext:latest
            ghcr.io/kiluth/erpnext:${{ steps.vars.outputs.image_tag }}
            ghcr.io/kiluth/erpnext:sha-${{ github.sha }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ steps.vars.outputs.frappe_branch }}
            FRAPPE_IMAGE_PREFIX=frappe
          secret-files: |
            apps_json=./apps.json
          # GHA cache disabled deliberately. BuildKit's secret-mount caching
          # ignores apps.json content changes — the same workflow reusing
          # the cache will silently bake an old kiluth_portal commit even
          # after we bump the SHA in apps.json. Cold builds are ~10 min on
          # ubuntu-latest; the price of correctness over speed.
          # Re-enable with `cache-from: type=gha` if/when we move app pinning
          # into the Containerfile (e.g. ADD apps.json /tmp/apps.json before
          # the install RUN, which would make BuildKit hash apps.json into
          # the layer key).
          no-cache: true

      # Tell Coolify to pull the freshly-pushed :latest and redeploy. The
      # app UUID is taken from the dashboard URL path. force=true ensures
      # Coolify redeploys even though the :latest tag's content moved
      # (it can't tell from a moving tag without the SHA digest changing
      # in its own state). Skip silently if COOLIFY_TOKEN isn't set so a
      # missing secret doesn't fail the build.
      - name: Trigger Coolify redeploy
        if: success()
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "::warning::COOLIFY_TOKEN secret not set — skipping auto-deploy."
            echo "Add it in Settings → Secrets and variables → Actions."
            exit 0
          fi
          response_code=$(curl -sS -o /tmp/coolify-resp.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "https://coolify.kiluth.com/api/v1/deploy?uuid=lmoeh0cqhgtqsa9l7fnpbyp9&force=true")
          echo "Coolify response code: ${response_code}"
          cat /tmp/coolify-resp.txt
          echo
          if [ "${response_code}" -ge 400 ]; then
            echo "::error::Coolify returned ${response_code}"
            exit 1
          fi
