name: Kiluth / Build & push image

# Builds the Kiluth ERPNext image (Frappe + ERPNext + HRMS + kiluth_portal)
# and pushes to ghcr.io/Kiluth/erpnext. After the push succeeds, tells the
# portal EC2 host to pull :latest + restart its containers via AWS SSM
# run-command — no manual click required.
#
# The image is built from frappe_docker's images/layered/Containerfile —
# upstream's standard "install N extra apps on top of frappe/build" recipe.
# We pass our apps.json (which lists ERPNext, HRMS, kiluth_portal) as a
# Docker BuildKit secret so it's not baked into image layers.
#
# Triggers:
#  - push to main when apps.json, the Containerfile, or this workflow change
#  - manual dispatch (re-build on demand without commits)
#
# Heads up: a kiluth_portal commit alone does NOT trigger this workflow,
# because frappe_docker doesn't watch that repo. To pick up a kiluth_portal
# change you need to either (a) workflow_dispatch from the Actions tab, or
# (b) bump something inside this repo so the path filter fires. With
# `branch: main` in apps.json, the build pulls kiluth_portal HEAD at run
# time, so the trigger source doesn't matter — only that something runs.
#
# Auto-deploy (Phase 4g, 2026-06-05): replaced the Coolify webhook with
# AWS SSM run-command after Phase 4f moved portal.kiluth.com from Coolify
# (DO droplet) to EC2. Uses OIDC to assume the `frappe-docker-gha-deploy`
# IAM role (provisioned in kiluth-infra main.tf), then runs
# `docker compose pull && docker compose up -d` in /opt/frappe on the
# portal instance. Repo secret `AWS_ROLE_ARN` carries the role ARN; the
# instance ID is hardcoded below (it's also hardcoded in the IAM policy,
# for the same dependency-chain reason).
#
# Last triggered for kiluth_portal commit 5496cde (Resource Expired
# template now uses the same table format as Expires-in-N — was the only
# Resource notification left with minimal inline prose, fixed for parity).

on:
  push:
    branches: [main]
    paths:
      - "apps.json"
      - "images/**"
      - "compose.production.yaml"
      - "example.kiluth.env"
      - ".github/workflows/kiluth-build-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (default: ERPNEXT_VERSION from .env)"
        required: false
        type: string

# Default permissions are read-only; this job needs:
# - packages: write   → push image to GHCR
# - id-token: write   → AssumeRoleWithWebIdentity for AWS OIDC (deploy step)
permissions:
  contents: read
  packages: write
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  # Portal EC2 instance ID. Hardcoded here AND in the kiluth-infra IAM
  # policy that authorises this role to send SSM commands to it. If the
  # instance is ever replaced, update both places.
  PORTAL_INSTANCE_ID: i-0f43e68f46e9afbc2

jobs:
  build:
    name: Build & push to ghcr.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Read pinned versions from .env (CUSTOM_TAG / ERPNEXT_VERSION).
      # Falls back to inputs.tag if a manual dispatch overrides.
      - name: Read pinned versions
        id: vars
        run: |
          set -euo pipefail
          erpnext_version=$(grep '^ERPNEXT_VERSION=' example.kiluth.env | cut -d= -f2)
          custom_tag=$(grep '^CUSTOM_TAG=' example.kiluth.env | cut -d= -f2)
          override="${{ inputs.tag }}"
          tag="${override:-$custom_tag}"
          echo "frappe_branch=$erpnext_version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Containerfile reads /opt/frappe/apps.json via a BuildKit secret
      # mount. secret-files= passes the raw file under the `apps_json` id.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          platforms: linux/amd64
          # Ghcr.io is case-insensitive on org names but the repo path is
          # normalised lowercase — keep tags lowercase to match.
          tags: |
            ghcr.io/kiluth/erpnext:latest
            ghcr.io/kiluth/erpnext:${{ steps.vars.outputs.image_tag }}
            ghcr.io/kiluth/erpnext:sha-${{ github.sha }}
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ steps.vars.outputs.frappe_branch }}
            FRAPPE_IMAGE_PREFIX=frappe
          secret-files: |
            apps_json=./apps.json
          # GHA cache disabled deliberately. BuildKit's secret-mount caching
          # ignores apps.json content changes — the same workflow reusing
          # the cache will silently bake an old kiluth_portal commit even
          # after we bump the SHA in apps.json. Cold builds are ~10 min on
          # ubuntu-latest; the price of correctness over speed.
          # Re-enable with `cache-from: type=gha` if/when we move app pinning
          # into the Containerfile (e.g. ADD apps.json /tmp/apps.json before
          # the install RUN, which would make BuildKit hash apps.json into
          # the layer key).
          no-cache: true

      # Auth into AWS via OIDC. The role's trust policy is pinned to
      # repo:Kiluth/frappe_docker:ref:refs/heads/main, so only main-branch
      # workflow runs can assume it. Secret AWS_ROLE_ARN carries the ARN.
      - name: Configure AWS credentials via OIDC
        if: success()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Tell the portal EC2 to pull the freshly-pushed :latest and restart.
      # SSM run-command runs the script as root via the SSM agent, inside
      # /opt/frappe (where the compose file lives, provisioned by
      # kiluth-infra Frappe module).
      #
      # The script:
      #   1. docker compose pull             — fetch new :latest image
      #   2. enumerate services EXCEPT db    — db is mariadb (separate
      #      image), and its Bitnami healthcheck reports "unhealthy" even
      #      when functionally fine. If we include db in the `up` target,
      #      compose waits on the healthcheck and dependent services fail
      #      to start.
      #   3. docker compose up -d --no-deps <services>
      #      — recreates only the kiluth-image services, doesn't touch db,
      #      skips the dep-healthcheck wait. db keeps running with its
      #      pre-existing state.
      #
      # Polls SSM for up to ~6 min (image pull on a cold cache is the long
      # pole — ~3-4 min for a 367MB image on the EC2's network).
      - name: Deploy via SSM (docker compose pull + up --no-deps)
        if: success()
        run: |
          set -euo pipefail
          cmd_id=$(aws ssm send-command \
            --instance-ids "${PORTAL_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "GHA deploy: kiluth_portal latest (run ${{ github.run_id }})" \
            --parameters 'commands=["set -eux","cd /opt/frappe","docker compose pull","SERVICES=$(docker compose config --services | grep -v -E \"^db$\" | tr \"\\n\" \" \")","echo deploying: $SERVICES","docker compose up -d --no-deps $SERVICES","docker compose ps","docker image prune -f"]' \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command ID: ${cmd_id}"

          # Poll for completion. AWS-RunShellScript status transitions:
          # Pending → InProgress → Success | Failed | Cancelled | TimedOut.
          # 72 × 5s = 6 min total wait window.
          for i in $(seq 1 72); do
            sleep 5
            status=$(aws ssm get-command-invocation \
              --command-id "${cmd_id}" \
              --instance-id "${PORTAL_INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "[$i/72] status=${status}"
            case "${status}" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM command ${status}"
                aws ssm get-command-invocation \
                  --command-id "${cmd_id}" \
                  --instance-id "${PORTAL_INSTANCE_ID}" \
                  --query '{Stdout: StandardOutputContent, Stderr: StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
          done

          if [ "${status}" != "Success" ]; then
            echo "::error::SSM command did not complete within timeout (last status: ${status})"
            exit 1
          fi

          # Print the host's output so the build log shows what docker did.
          aws ssm get-command-invocation \
            --command-id "${cmd_id}" \
            --instance-id "${PORTAL_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text
